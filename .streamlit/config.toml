# Streamlit Configuration for Fiber Maintenance Analytics System
# ============ OPTIMIZED FOR 16GB MACHINE WITH 5-10 CONCURRENT USERS ============

[theme]
# Primary accent color for interactive elements
primaryColor = "#667eea"

# Background color for the main content area
backgroundColor = "#0f172a"

# Background color for sidebar and most interactive widgets
secondaryBackgroundColor = "#1e293b"

# Color used for almost all text
textColor = "#f1f5f9"

# Font family for all text in the app
font = "sans serif"

[server]
# CORS enabled (required when XSRF protection is on)
enableCORS = true

# Enable XSRF protection
enableXsrfProtection = true

# Max upload size in MB (reduced for memory efficiency)
maxUploadSize = 100

# Port (Streamlit Cloud will override this)
port = 8501

# ============ OPTIMIZED PERFORMANCE SETTINGS ============
# Maximum message size for WebSocket (200MB - reduced for memory)
maxMessageSize = 200

# Run in headless mode (required for production)
headless = true

# WebSocket compression for faster data transfer
enableWebsocketCompression = true

# Disable file watcher in production (major performance boost)
fileWatcherType = "none"

# Allow all origins for CORS when using zrok
enableStaticServing = false

# Limit concurrent WebSocket connections per session
runOnSave = false

[browser]
# Gather usage stats
gatherUsageStats = false

# Server address
serverAddress = "0.0.0.0"

# Don't open browser automatically
serverPort = 8501

[runner]
# Magic commands enabled
magicEnabled = true

[client]
# Show error details is disabled in production
showErrorDetails = false

# Toolbar mode (minimal for performance)
toolbarMode = "minimal"
