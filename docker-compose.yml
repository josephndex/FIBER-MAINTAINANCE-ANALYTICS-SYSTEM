version: '3.8'

services:
  fiber-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiber-maintenance-analytics
    image: fiber-maintenance-analytics:latest
    ports:
      - "8501:8501"
    environment:
      - DB_NAME_1=fiber_maintainance_department
      - DB_HOST_1=host.docker.internal
      - DB_USER_1=root
      - DB_PASSWORD_1=Fireside.Africa1or!
      - DB_NAME_2=fiber_maintainance_department
      - DB_HOST_2=host.docker.internal
      - DB_USER_2=root
      - DB_PASSWORD_2=Fireside.Africa1or!
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # ============ OPTIMIZED PERFORMANCE SETTINGS FOR 16GB MACHINE ============
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
      - STREAMLIT_SERVER_ENABLE_WEBSOCKET_COMPRESSION=true
      - STREAMLIT_SERVER_MAX_MESSAGE_SIZE=200
      # Python optimizations
      - PYTHONOPTIMIZE=2
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./.streamlit:/app/.streamlit:ro
    restart: unless-stopped
    # ============ OPTIMIZED RESOURCE ALLOCATION FOR 16GB MACHINE ============
    # Reduced for better performance when RAM is limited
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fiber-network

  # --- NEW ZROK SERVICE ---
  zrok-service:
    image: openziti/zrok
    user: root
    restart: unless-stopped
    volumes:
      - zrok_data:/root/.zrok
    environment:
      - ZROK_ENABLE_TOKEN=7YgMZYl6iJ06
      - ZROK_UNIQUE_NAME=fibermaintainaceanalytics
      - ZROK_TARGET=http://fiber-analytics:8501
    # SIMPLIFIED ENTRYPOINT (No complex if/else to break)
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "--- 1. Attempting to Enable ---"
        # Try to enable. If it fails (already enabled), just continue.
        zrok enable $${ZROK_ENABLE_TOKEN} || true

        echo "--- 2. Reserving Subdomain ---"
        # Try to reserve. If it fails (already reserved), just continue.
        zrok reserve public --unique-name $${ZROK_UNIQUE_NAME} $${ZROK_TARGET} || true
        
        echo "--- 3. Sharing ---"
        # If this fails, it means the state is truly broken and we will auto-repair
        zrok share reserved --headless $${ZROK_UNIQUE_NAME} || (echo "State broken, resetting..." && zrok disable && zrok enable $${ZROK_ENABLE_TOKEN} && zrok share reserved --headless $${ZROK_UNIQUE_NAME})
    networks:
      - fiber-network

volumes:
  zrok_data:

networks:
  fiber-network:
    driver: bridge