name: Build All Platforms

on:
  push:
    branches:
      - actuall-app-deployment
      - main
  pull_request:
    branches:
      - actuall-app-deployment
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  # =====================================================
  # BUILD WINDOWS
  # =====================================================
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop_app/electron
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop_app/electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            desktop_app/electron/dist/*.exe
          retention-days: 30

  # =====================================================
  # BUILD LINUX
  # =====================================================
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop_app/electron
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop_app/electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            desktop_app/electron/dist/*.AppImage
            desktop_app/electron/dist/*.deb
          retention-days: 30

  # =====================================================
  # BUILD MACOS
  # =====================================================
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop_app/electron
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop_app/electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            desktop_app/electron/dist/*.dmg
            desktop_app/electron/dist/*.zip
          retention-days: 30

  # =====================================================
  # BUILD ANDROID APK
  # =====================================================
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile_app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: |
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: mobile_app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # =====================================================
  # CREATE RELEASE (only on tags)
  # =====================================================
  create-release:
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-build/*
            artifacts/linux-build/*
            artifacts/macos-build/*
            artifacts/android-build/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
