name: Build All Platforms

on:
  push:
    branches:
      - actuall-app-deployment
      - main
  pull_request:
    branches:
      - actuall-app-deployment
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  # =====================================================
  # BUILD WINDOWS
  # =====================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop_app/electron
        run: npm install

      - name: Build Windows
        working-directory: desktop_app/electron
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: desktop_app/electron/dist/*.exe
          retention-days: 30
          if-no-files-found: warn

  # =====================================================
  # BUILD LINUX
  # =====================================================
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop_app/electron
        run: npm install

      - name: Build Linux
        working-directory: desktop_app/electron
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            desktop_app/electron/dist/*.AppImage
            desktop_app/electron/dist/*.deb
          retention-days: 30
          if-no-files-found: warn

  # =====================================================
  # BUILD MACOS
  # =====================================================
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop_app/electron
        run: npm install

      - name: Build macOS
        working-directory: desktop_app/electron
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            desktop_app/electron/dist/*.dmg
            desktop_app/electron/dist/*.zip
          retention-days: 30
          if-no-files-found: warn

  # =====================================================
  # BUILD ANDROID APK
  # =====================================================
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/ngrok

      - name: Install dependencies
        working-directory: mobile_app
        run: npm install

      - name: Build Android APK
        working-directory: mobile_app
        run: |
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: mobile_app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

  # =====================================================
  # CREATE RELEASE (only on tags)
  # =====================================================
  create-release:
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-build/*
            artifacts/linux-build/*
            artifacts/macos-build/*
            artifacts/android-build/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
