name: Build All Platforms

on:
  push:
    branches:
      - actuall-app-deployment
      - main
    tags:
      - 'v*'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  # =====================================================
  # BUILD WINDOWS EXE
  # =====================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop_app/electron
        run: npm install

      - name: Build Windows EXE
        working-directory: desktop_app/electron
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist folder
        working-directory: desktop_app/electron
        run: dir dist
        shell: cmd
        continue-on-error: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            desktop_app/electron/dist/*.exe
            desktop_app/electron/dist/*.msi
          retention-days: 30
          if-no-files-found: warn

  # =====================================================
  # BUILD ANDROID APK (using Expo prebuild + Gradle)
  # =====================================================
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Expo CLI
        run: npm install -g expo-cli eas-cli

      - name: Install dependencies
        working-directory: mobile_app
        run: npm install

      - name: Expo prebuild
        working-directory: mobile_app
        run: |
          npx expo prebuild --platform android --clean --no-install
          ls -la android/ || echo "No android folder created"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install Android dependencies
        working-directory: mobile_app/android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build APK with Gradle
        working-directory: mobile_app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find and copy APK
        working-directory: mobile_app
        run: |
          mkdir -p dist
          find . -name "*.apk" -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile_app/dist/*.apk
          retention-days: 30
          if-no-files-found: warn

  # =====================================================
  # CREATE GITHUB RELEASE (only on version tags)
  # =====================================================
  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-exe/*
            artifacts/android-apk/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
