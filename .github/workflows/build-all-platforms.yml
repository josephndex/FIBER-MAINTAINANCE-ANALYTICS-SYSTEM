name: Build All Platforms

on:
  push:
    branches:
      - actuall-app-deployment
      - main
    tags:
      - 'v*'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  # =====================================================
  # BUILD WINDOWS EXE
  # =====================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop_app/electron
        run: npm install

      - name: Build Windows EXE
        working-directory: desktop_app/electron
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist folder
        working-directory: desktop_app/electron
        run: dir dist
        shell: cmd

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            desktop_app/electron/dist/*.exe
            desktop_app/electron/dist/*.msi
          retention-days: 30
          if-no-files-found: warn

  # =====================================================
  # BUILD LINUX APPIMAGE
  # =====================================================
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop_app/electron
        run: npm install

      - name: Build Linux AppImage
        working-directory: desktop_app/electron
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist folder
        working-directory: desktop_app/electron
        run: ls -la dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            desktop_app/electron/dist/*.AppImage
            desktop_app/electron/dist/*.deb
            desktop_app/electron/dist/*.rpm
          retention-days: 30
          if-no-files-found: warn

  # =====================================================
  # BUILD MACOS DMG
  # =====================================================
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop_app/electron
        run: npm install

      - name: Build macOS DMG
        working-directory: desktop_app/electron
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist folder
        working-directory: desktop_app/electron
        run: ls -la dist/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            desktop_app/electron/dist/*.dmg
            desktop_app/electron/dist/*.zip
          retention-days: 30
          if-no-files-found: warn

  # =====================================================
  # BUILD ANDROID APK (using EAS Build)
  # =====================================================
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile_app
        run: npm install

      - name: Build Android APK with EAS
        working-directory: mobile_app
        run: eas build --platform android --profile preview --non-interactive --local
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Find APK file
        working-directory: mobile_app
        run: |
          find . -name "*.apk" -type f
          mkdir -p dist
          find . -name "*.apk" -type f -exec cp {} dist/ \;

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile_app/dist/*.apk
          retention-days: 30
          if-no-files-found: warn

  # =====================================================
  # CREATE GITHUB RELEASE (only on version tags)
  # =====================================================
  create-release:
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-exe/*
            artifacts/linux-appimage/*
            artifacts/macos-dmg/*
            artifacts/android-apk/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
