name: Build Android APK

on:
  push:
    branches:
      - actuall-app-deployment
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile_app
        run: npm install

      - name: Create EAS Project (force create if not exists)
        working-directory: mobile_app
        run: |
          echo "Creating/linking EAS project for owner: nderitu"
          npx eas-cli init --id fiber-maintenance-analytics --force --non-interactive || echo "Init completed"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: mobile_app
        run: |
          echo "Starting Android APK build..."
          npx eas-cli build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Info
        run: |
          echo "============================================"
          echo "Android APK Build Submitted!"
          echo "============================================"
          echo ""
          echo "Download your APK from:"
          echo "https://expo.dev/accounts/nderitu/projects/fiber-maintenance-analytics/builds"
          echo ""
          echo "Build takes ~10-15 minutes"
          echo "============================================"
